name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v -m "not slow"

      - name: Install zw-gender-data
        # Not on PyPI yet, so install it straight from GitHub. Once it is
        # published this step goes away and the dependency resolves normally.
        run: pip install "zw-gender-data @ git+https://github.com/Gamuchirai-Magamba/zw-gender-data.git@main"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"